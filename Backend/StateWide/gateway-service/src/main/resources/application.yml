
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/auth/**
                 
            - id: HISCommon-Service
              uri: http://localhost:8083
              predicates:
                - Path=/his/common-service/**

            - id: HISRegistration-Service
              uri: http://localhost:8084
              predicates:
                - Path=/his/reg/**
                
          # Optionally, you can disable path stripping
          filters:
            - StripPrefix=0

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    com.cdac.statewide.gatewayservice: DEBUG  




